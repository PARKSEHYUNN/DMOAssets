<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <title>DMOAssets</title>
    <style>
      /* 색은 한곳에 모아 둔다 (어두운 화면 하나만 쓴다) */
      :root {
        --bg: #1e1e22;
        --panel: #26262b;
        --line: #37373d;
        --text: #e4e4e7;
        --dim: #9a9aa3;
        --accent: #4a9eff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        font: 13px/1.5 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      /* 위쪽 줄: 폴더 열기, 검색, 추출 */
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      input {
        font: inherit;
        flex: 1;
        min-width: 120px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 5px 8px;
      }
      #dir { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
      /* 가운데: 왼쪽 파일 목록, 오른쪽 미리보기 */
      main { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
      #tree { overflow: auto; padding: 6px 10px; border-right: 1px solid var(--line); }
      #preview { overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      /* 모델 뷰어 캔버스. 남는 자리를 다 쓰고, 모델이 없을 때는 hidden 이라 자리를 차지하지 않는다 */
      #viewer { display: block; width: 100%; flex: 1; min-height: 0; border-radius: 4px; }
      #viewer[hidden] { display: none; }
      /* 미리보기 이미지는 바둑판 배경 위에 올려 투명한 부분을 보이게 한다 */
      #preview img {
        max-width: 100%;
        align-self: flex-start;
        image-rendering: pixelated;
        background: repeating-conic-gradient(#3a3a40 0 25%, #2b2b30 0 50%) 0 0 / 16px 16px;
      }
      #info { color: var(--dim); white-space: pre-wrap; }
      /* 트리: 폴더는 details, 파일은 div */
      details > summary { cursor: pointer; padding: 1px 0; list-style: none; }
      details > summary::before { content: '▸ '; color: var(--dim); }
      details[open] > summary::before { content: '▾ '; }
      details > div { margin-left: 14px; }
      .file { padding: 1px 4px; cursor: pointer; border-radius: 3px; }
      .file:hover { background: var(--panel); }
      .file.sel { background: var(--accent); color: #fff; }
      .size { color: var(--dim); margin-left: 6px; }
      footer { padding: 6px 10px; border-top: 1px solid var(--line); color: var(--dim); }
      /* 동작 고르기 줄. 동작이 있는 모델을 열었을 때만 보인다 */
      #animBar { display: flex; align-items: center; gap: 6px; color: var(--dim); }
      #animBar[hidden] { display: none; }
      #anim {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 6px;
        max-width: 260px;
      }
      /* 체크박스는 글자와 붙여 놓는다 (입력칸처럼 늘어나면 안 된다) */
      label.opt { display: flex; align-items: center; gap: 4px; color: var(--dim); white-space: nowrap; }
      label.opt input { flex: none; min-width: 0; margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <button id="openBtn">Open DMO folder…</button>
      <span id="dir">No folder open</span>
      <input id="search" type="search" placeholder="Search path (e.g. agumon)" disabled />
      <label class="opt" title="Drop the glow and darkening layers that sit on top of the model">
        <input id="noEffects" type="checkbox" />
        No effect layers
      </label>
      <button id="extractBtn" disabled>Extract…</button>
      <button id="exportBtn" disabled>Export GLB…</button>
    </header>
    <main>
      <div id="tree"></div>
      <div id="preview">
        <div id="animBar" hidden>
          Animation
          <select id="anim"></select>
        </div>
        <canvas id="viewer" hidden></canvas>
        <div id="info">Open a DMO Data folder to start.</div>
      </div>
    </main>
    <footer id="status">Ready</footer>
    <!-- three.js 는 번들러 없이 import map 으로 node_modules 에서 바로 읽는다.
         import map 은 인라인만 되고 (외부 파일은 이 Chromium 에서 안 읽는다), 그래서 CSP 에 script-src 'unsafe-inline' 이 필요하다.
         이 창은 로컬 파일만 열고 팩 내용을 HTML 로 만들지 않으므로 (전부 textContent) 위험이 없다 -->
    <script type="importmap">
      {
        "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
